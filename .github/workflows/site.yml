name: 정적 사이트 검증

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: 정적 사이트 검증
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - name: HTML과 인라인 JavaScript 구문 검사
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(match => match[1]);
          if (scripts.length !== 1) throw new Error('dist/index.html에 인라인 script가 하나 필요합니다.');
          new Function(scripts[0]);
          for (const required of ['손금연구소', 'heart', 'head', 'life']) {
            if (!html.includes(required)) throw new Error(`필수 콘텐츠 누락: ${required}`);
          }
          console.log(`검증 완료: ${Buffer.byteLength(html)} bytes`);
          NODE
      - name: 필수 파일 확인
        run: test -f dist/index.html && test -f .openai/hosting.json
